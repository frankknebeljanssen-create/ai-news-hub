# Quellen fuer ai-news-hub. Neue Quelle = neuer Eintrag, sonst nichts.
#
# id            eindeutiger Kurzname
# name          Anzeigename
# type          rss | web
# region        intl | de   (Hinweis fuer die Einordnung, die Zuordnung pro Artikel macht Claude)
# url           Feed-URL (rss) oder Uebersichtsseite (web)
# link_pattern  nur web: Regex, den Artikel-Links der Uebersichtsseite erfuellen muessen
# keywords      optional: nur Artikel behalten, deren Titel/Teaser eines dieser Woerter enthaelt
#               (fuer allgemeine Feeds ohne KI-Fokus)
# max_items     optional: Obergrenze neuer Artikel pro Lauf (Standard 6)
# google_news   true = Sammel-Feed (Google News RSS), Quelle und Titel kommen aus dem Eintrag, kein Teaser
# priority      true = Quelle wird bei Engpaessen zuerst kuratiert
# enabled       false = Quelle bleibt eingetragen, wird aber nicht abgerufen
# note          Freitext, z. B. warum deaktiviert

sources:
  # ---------- International ----------
  - {id: neuron, name: The Neuron, type: rss, region: intl, url: "https://www.theneuron.ai/feed", priority: true, max_items: 10}
  - {id: rundown, name: The Rundown AI, type: rss, region: intl, url: "https://www.therundown.ai/feed", priority: true}
  - {id: tldr-ai, name: TLDR AI, type: rss, region: intl, url: "https://tldr.tech/api/rss/ai"}
  - {id: import-ai, name: Import AI, type: rss, region: intl, url: "https://importai.substack.com/feed", priority: true}
  - id: batch
    name: The Batch
    type: web
    region: intl
    url: "https://www.deeplearning.ai/the-batch/"
    link_pattern: "deeplearning\\.ai/the-batch/issue-\\d+"
    note: Kein RSS-Feed vorhanden
  - id: anthropic
    name: Anthropic
    type: rss
    region: intl
    url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml"
    note: Kein offizieller Feed, Community-Feed (GitHub, Olshansk/rss-feeds)
  - {id: openai, name: OpenAI, type: rss, region: intl, url: "https://openai.com/news/rss.xml"}
  - {id: deepmind, name: Google DeepMind, type: rss, region: intl, url: "https://deepmind.google/blog/rss.xml"}
  - id: meta-ai
    name: Meta (Engineering, ML)
    type: rss
    region: intl
    url: "https://engineering.fb.com/category/ml-applications/feed/"
    note: ai.meta.com/blog hat keinen Feed, Ersatz ist der Engineering-Blog
  - {id: huggingface, name: Hugging Face, type: rss, region: intl, url: "https://huggingface.co/blog/feed.xml"}
  - {id: mit-tr, name: MIT Technology Review, type: rss, region: intl, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"}
  - id: politico-eu
    name: Politico Europe
    type: rss
    region: intl
    url: "https://www.politico.eu/feed/"
    keywords: [AI, "artificial intelligence", "AI Act", chatbot, OpenAI, algorithm]
  - id: euractiv
    name: Euractiv
    type: web
    region: intl
    url: "https://www.euractiv.com/section/digital/"
    link_pattern: "euractiv\\.com/news/"
    enabled: false
    note: Feed und Seite liefern HTTP 403 (Bot-Schutz), vorerst deaktiviert

  # aus dem frueheren Projekt myainews
  - {id: verge-ai, name: The Verge AI, type: rss, region: intl, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", max_items: 4}
  - {id: ars-ai, name: Ars Technica AI, type: rss, region: intl, url: "https://arstechnica.com/ai/feed/", max_items: 4}
